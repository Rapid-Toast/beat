<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeatThe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe7ea;--panel:#fff;--ink:#1d2b36;--muted:#5d6e7a;--carpet:#3f5b6b;--hole:#1a2630;--desk:#b98b5e;--accent:#d8402f;--note:#ffd84d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--panel:#1b2831;--ink:#eef3f5;--muted:#9fb0ba;--carpet:#2c4350;--hole:#070b0e;--desk:#8d6a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181e;--panel:#1b2831;--ink:#eef3f5;--muted:#9fb0ba;--carpet:#2c4350;--hole:#070b0e;--desk:#8d6a47;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:560px;height:100%;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:clamp(24px,5.5vh,36px);font-weight:800;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--accent)}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:5px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat small{color:var(--muted);font-size:11px}
.note{background:var(--note);color:#2a2400;border-radius:4px;padding:7px 12px;min-height:36px;font-size:14px;font-weight:500;transform:rotate(-.6deg);box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center}
.floor{background:var(--carpet);border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;position:relative;flex:1;min-height:0}
.cube{position:relative;min-width:0;min-height:0}
.pit{position:absolute;inset:0;overflow:hidden;border-radius:0 0 50% 50%/0 0 22% 22%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hole{position:absolute;left:6%;right:6%;bottom:4%;height:24%;background:var(--hole);border-radius:50%}
.pop{position:absolute;left:12%;right:12%;bottom:12%;top:6%;transform:translateY(105%);transition:transform .12s ease-out;display:flex;align-items:flex-end;justify-content:center}
.pop.up{transform:translateY(0)}
.pop svg{width:100%;height:100%}
.pop.hit{transform:translateY(32%) scaleY(.82);transition:transform .08s}
.pop.hit::after{content:"💥";position:absolute;top:0;font-size:clamp(22px,7vw,34px)}
.desk{position:absolute;left:0;right:0;bottom:0;height:16%;background:var(--desk);border-radius:6px;pointer-events:none}
.intern{font-size:clamp(34px,min(15vw,9vh),76px);line-height:1;padding-bottom:4px}
.hammer{position:fixed;left:0;top:0;font-size:44px;pointer-events:none;z-index:50;transform:translate(-30%,-70%) rotate(-30deg);transform-origin:70% 90%;transition:transform .07s;display:none}
.hammer.swing{transform:translate(-30%,-70%) rotate(35deg)}
@media (pointer:fine){.floor,.floor *{cursor:none}.hammer{display:block}.overlay,.overlay *{cursor:auto!important}.overlay button,.overlay a{cursor:pointer!important}}
.overlay{position:absolute;inset:0;background:rgba(10,18,24,.88);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;gap:8px;padding:14px;color:#fff;z-index:5;overflow:auto}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:28px;font-weight:800}
.overlay p{margin:0;max-width:34ch;font-size:15px;color:#d5e0e6}
.big{font-size:44px;line-height:1}
.pick{font-size:13px;color:#d5e0e6;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.chip{font:inherit;font-size:14px;font-weight:500;background:transparent;color:#fff;border:2px solid #8fa3ae;border-radius:999px;padding:5px 12px;box-shadow:none;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:#1d2b36;border-color:#fff}
.custom{display:flex;gap:6px}
.custom input{font:inherit;font-size:14px;width:150px;border-radius:999px;border:2px solid #8fa3ae;background:transparent;color:#fff;padding:5px 12px;-webkit-user-select:text;user-select:text}
.custom input::placeholder{color:#9fb0ba}
.custom button{font-size:14px;padding:5px 14px;border-radius:999px;box-shadow:none}
button{font:inherit;font-weight:800;font-size:18px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--note);outline-offset:2px}
button.alt{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none;font-size:16px;padding:9px 20px}
.vidArea{display:flex;flex-direction:column;align-items:center;gap:6px}.vidArea[hidden],#vid[hidden]{display:none}#vid{max-height:26vh;max-width:70%;border-radius:10px;background:#000}.vbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.vbtns button{font-size:15px;padding:8px 16px}button:disabled{opacity:.5;cursor:default}
.share{display:flex;flex-direction:column;align-items:center;gap:8px}
.share[hidden],.links[hidden],.custom[hidden]{display:none}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.links a,.links button{font:inherit;font-size:14px;font-weight:500;color:#1d2b36;background:#fff;border:0;border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:none}
.smsg{font-size:13px;color:#d5e0e6;min-height:16px}
.legend{font-size:12px;color:var(--muted);text-align:center;margin:0}
.srch{font:inherit;font-size:14px;width:min(100%,300px);border-radius:999px;border:2px solid #8fa3ae;background:transparent;color:#fff;padding:6px 14px;-webkit-user-select:text;user-select:text}
.srch::placeholder{color:#9fb0ba}
.pgrp{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}.pgrp[hidden]{display:none}
.tlist{width:min(100%,340px);max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:5px;text-align:left}
.th{font-size:11px;color:#9fb0ba;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 0}
.tnote{font-size:13px;color:#ffd84d;margin:2px}
.trow{display:flex;align-items:center;gap:10px;font:inherit;font-weight:500;font-size:14px;background:rgba(255,255,255,.08);color:#fff;border:2px solid transparent;border-radius:12px;padding:5px 10px;box-shadow:none;text-align:left;width:100%}
.trow[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.18)}
.av{width:36px;height:36px;border-radius:8px;flex:none;object-fit:contain;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.trow b{display:block;font-size:14px}.trow small{display:block;font-size:11px;color:#c5d3da;font-weight:400}
.addf{display:flex;flex-direction:column;align-items:center;gap:6px}.addf[hidden],.addf img[hidden],.srch[hidden]{display:none}
.addf img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.12)}
button.sm{font-size:14px;padding:6px 14px}
@media (max-height:720px){.sub,.legend{display:none}.overlay h2{font-size:22px}.overlay p{font-size:14px}.big{font-size:34px}button{font-size:16px;padding:9px 20px}}
@media (prefers-reduced-motion:reduce){.pop,.hammer{transition:none}}
</style>
</head>

<main>
  <header>
    <h1 id="title" role="button" tabindex="0" title="Change character or sign in" style="cursor:pointer">Beat the <span>HR</span></h1>

  <div class="stats">

      <button class="alt sm" id="addBtn" type="button">+ Add your own character</button>
      <button class="alt sm" id="accBtn" type="button">My account</button>
      <div class="addf" id="accP" hidden style="width:min(100%,340px)"></div>
      <div class="addf" id="authf" hidden>
        <input id="aUser" class="srch" type="text" maxlength="20" autocomplete="username" autocapitalize="off" placeholder="Username" aria-label="Username">
        <input id="aPass" class="srch" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <div class="vbtns"><button class="sm" id="aCreate" type="button">Create account</button><button class="alt sm" id="aLogin" type="button">Sign in</button></div>
        <div class="smsg" id="aMsg" role="status"></div>
      </div>
      <div class="addf" id="addf" hidden>
        <input id="nName" class="srch" type="text" maxlength="14" placeholder="Character name" aria-label="Character name">
        <input id="nFile" type="file" accept="image/*" hidden>
        <img id="nPrev" alt="" hidden>
        <button class="alt sm" id="nPick" type="button">Choose image</button>
        <div class="vbtns"><button class="sm" id="nSave" type="button">Save character</button><button class="alt sm" id="nCancel" type="button">Cancel</button></div>
        <div class="smsg" id="nMsg" role="status"></div>
      </div>
      </div>
      <button id="start">Start beating</button>
      <button class="alt" id="newGame" type="button" hidden>New game</button>
      <div class="share" id="share" hidden>
        <button class="alt" id="shareBtn" type="button">Share your score</button>
        <div class="links" id="links" hidden>
          <a id="shWa" target="_blank" rel="noopener">WhatsApp</a>
          <a id="shX" target="_blank" rel="noopener">X</a>
          <a id="shFb" target="_blank" rel="noopener">Facebook</a>
          <a id="shTg" target="_blank" rel="noopener">Telegram</a>
          <button id="shCopy" type="button">Copy text</button>
        </div>
        <div class="smsg" id="smsg" role="status"></div>
      </div>
    </div>
  </div>
  <p class="legend">Click or tap to whack. Your 60-second game is recorded so you can share the video.</p>
</main>
<div class="hammer" id="hammer">🔨</div>

/* Firebase backend for a normal website (GitHub Pages). Fill in FIREBASE_CONFIG (see SETUP.md).
   Players sign up with just a username + password (stored as a made-up email, nothing is ever sent).
   Guests can play; an account is needed to add characters and to delete them. */
(function(){
  var FIREBASE_CONFIG={apiKey:"AIzaSyA2_8rosr05usYByrK_HE8IA8zd5XcOZ8A",authDomain:"beat-dce86.firebaseapp.com",projectId:"beat-dce86",appId:"1:587112964067:web:884b63e57ee3104a940ad6"};
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0)return;

  }
  function nameOf(c){var u=c.au.currentUser;return u.isAnonymous?"Guest "+u.uid.slice(0,4):String(u.displayName||(u.email||"player").split("@")[0]).replace(/[^A-Za-z0-9_]/g,"").slice(0,20);}
  function uemail(n){return n.toLowerCase()+"@users.beatthe.app";}
  function chk(n,p){if(!/^[A-Za-z0-9_]{3,20}$/.test(n))throw new Error("Username: 3 to 20 letters, numbers or _");if((p||"").length<6)throw new Error("Password: at least 6 characters");}
  function msg(e){var k=(e&&e.code)||"";if(k==="auth/email-already-in-use"||k==="auth/credential-already-in-use")return "That username is taken.";if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(k))return "Wrong username or password.";if(k==="auth/network-request-failed")return "Network problem. Try again.";if(k==="auth/operation-not-allowed")return "Email/Password sign-in isn’t enabled in Firebase yet.";return "Something went wrong. Try again.";}
  function mkdb(c){
    var F=c.F,fs=c.fs;
    return {collection:function(name){
      var col=F.collection(fs,name);
      return {
        doc:function(id){var r=F.doc(fs,name,id);return {
          get:async function(){var s=await F.getDoc(r);return {exists:s.exists(),data:function(){return s.data();}};},
          set:async function(d){if(name==="targets"&&c.au.currentUser.isAnonymous)throw new Error("sign-in required");return F.setDoc(r,d);},

  }
  async function saveName(c){var u=c.au.currentUser;if(u.isAnonymous)return;await c.F.setDoc(c.F.doc(c.fs,"players",u.uid),{name:nameOf(c)});}

      },

        return out;
      }
    };
  }
  window.claude={use:async function(n){
    if(n==="db")return mkdb(await init());

  function renderList(){
    var q=qIn.value.trim().toLowerCase();tlist.textContent="";
    var ls=localT.filter(function(t){return has(t.name,q);});
    if(ls.length){head("Your guest characters (only on this device)");ls.forEach(function(t){row(t.name,"l-"+t.id,t.img,"");});}
    var us=uTargets.filter(function(t){return has(t.name,q);}).sort(function(a,b){return beats("u-"+b.id)-beats("u-"+a.id);});
    var gs=NAMES.filter(function(n){return has(n,q);});
    if(us.length){head("Player-made");us.forEach(function(t){row(t.name,"u-"+t.id,t.img,t.by||"");});}
    else if(q&&db&&gs.length)tnote("No player-made target found. Use a game one:");
    if(gs.length){head("Game targets");gs.forEach(function(n){row(n,gkey(n),null,"",PROFS[n].s,PROFS[n].b);});}
    if(!us.length&&!gs.length)tnote("Nothing found. Try another search"+(db?" or add your own.":"."));
  }
  qIn.addEventListener("input",renderList);
  function resolveNames(){
    var ids=[];uTargets.forEach(function(t){if(t.by&&t.by.charAt(0)!=="@"&&ids.indexOf(t.by)<0&&!(t.by in names))ids.push(t.by);});
    if(!ids.length||!userNs||!userNs.profiles)return;
    userNs.profiles(ids).then(function(ps){ids.forEach(function(i){names[i]=(ps&&ps[i]&&ps[i].name)||"";});renderList();}).catch(function(){});
  }
  function submitScore(sc){
    if(!db||!uid||sc<=0||curKey.slice(0,2)==="l-")return;
    var ref=db.collection("scores").doc(curKey+"__"+String(uid).replace(/\//g,"_"));
    ref.get().then(function(d){var o=(d.exists&&d.data())||{};return ref.set({t:curKey,u:uid,n:(o.n||0)+sc,p:(o.p||0)+1,b:Math.max(o.b||0,sc)});}).catch(function(){});
  }
  function readImg(f,cb){
    var r=new FileReader();
    r.onload=function(){var im=new Image();
      im.onload=function(){var s=Math.min(1,128/Math.max(im.width,im.height,1)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/png"));};
      im.onerror=function(){cb(null);};im.src=r.result;};
    r.onerror=function(){cb(null);};r.readAsDataURL(f);
  }
  function isAcct(){return !!(userNs&&userNs.isSignedIn&&userNs.isSignedIn());}
  function remine(){var m={};rawS.forEach(function(o){if(o.u===uid)m[o.t]=o;});mine=m;}
  function refreshMe(){return Promise.resolve(userNs.id()).then(function(i){uid=i;return userNs.me();}).then(function(m){myName=(m&&m.name)||"";remine();renderList();renderAcc();});}
  function offline(){return !(userNs&&userNs.signUp);}
  function showAuth(){document.getElementById("authf").hidden=false;addf.hidden=true;document.getElementById("aMsg").textContent=offline()?"Online features aren’t connected yet. Please try again later.":"";document.getElementById("aUser").focus();}
  function doAuth(){if(isAcct()){userNs.signOut().then(refreshMe).catch(function(){});}else{wantAdd=false;showAuth();}}
  function authGo(isNew){
    var u=document.getElementById("aUser").value,pw=document.getElementById("aPass").value,m=document.getElementById("aMsg");
    if(offline()){m.textContent="Online features aren’t connected yet. Please try again later.";return;}
    m.textContent="Please wait…";
    (isNew?userNs.signUp(u,pw):userNs.signInUser(u,pw)).then(refreshMe).then(function(){
      document.getElementById("authf").hidden=true;document.getElementById("aPass").value="";m.textContent="";if(wantAdd)addf.hidden=false;
    }).catch(function(e){m.textContent=(e&&e.message)||"Couldn’t sign in.";});
  }
  document.getElementById("aCreate").addEventListener("click",function(){authGo(true);});
  document.getElementById("aLogin").addEventListener("click",function(){authGo(false);});
  addBtn.addEventListener("click",function(){
    addf.hidden=!addf.hidden;document.getElementById("authf").hidden=true;
    nMsg.textContent=isAcct()?"":"Guest: only you will see this character. Sign in (My account) to share it.";
  });
  document.getElementById("nCancel").addEventListener("click",function(){addf.hidden=true;});
  document.getElementById("nPick").addEventListener("click",function(){nFile.click();});
  nFile.addEventListener("change",function(){
    var f=nFile.files&&nFile.files[0];if(!f)return;
    readImg(f,function(u){newImg=u;nPrev.hidden=!u;if(u)nPrev.src=u;nMsg.textContent=u?"":"Couldn’t read that image.";});
  });
  document.getElementById("nSave").addEventListener("click",function(){
    var nm=clean(nName.value);
    if(!nm){nMsg.textContent="Give your character a name.";return;}
    if(!newImg){nMsg.textContent="Choose an image first.";return;}
    nm=nm.charAt(0).toUpperCase()+nm.slice(1);
    var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),img=newImg;
    if(!isAcct()||!db){localT.unshift({id:id,name:nm,img:img});localT=localT.slice(0,5);try{localStorage.setItem("bt-local",JSON.stringify(localT));}catch(e){}addf.hidden=true;nName.value="";newImg=null;nPrev.hidden=true;nFile.value="";nMsg.textContent="";setProf(nm,"l-"+id,img);return;}
    nMsg.textContent="Saving…";
    db.collection("targets").doc(id).set({name:nm,img:img,by:uid||"",at:Date.now()}).then(function(){
      addf.hidden=true;nName.value="";newImg=null;nPrev.hidden=true;nFile.value="";nMsg.textContent="";
      setProf(nm,"u-"+id,img);
    }).catch(function(){nMsg.textContent="Couldn’t save. Make sure you’re signed in.";});
  });
  (async function(){
    try{
      if(!window.claude||!claude.use)return;
      var d=await claude.use("db");if(!d)return;
      try{userNs=await claude.use("user");uid=userNs?await userNs.id():null;myName=userNs?((await userNs.me()).name||""):"";}catch(e){}
      guestId=uid;guestName=myName;
      db=d;addBtn.hidden=false;accBtn.hidden=false;
      d.collection("targets").onSnapshot(function(sn){
        uTargets=sn.docs.map(function(x){var o=x.data()||{};return {id:x.id,name:clean(String(o.name||"")),img:o.img,by:o.by};}).filter(function(t){return t.name;});
        resolveNames();renderList();renderAcc();
      },function(){});
      d.collection("scores").onSnapshot(function(sn){
        var st={},ms={};rawS=[];sn.docs.forEach(function(x){var o=x.data()||{};if(!o.t)return;rawS.push(o);if(o.u&&o.u===uid)ms[o.t]=o;var a=st[o.t]||(st[o.t]={users:0,beats:0});if(o.n>0)a.users++;a.beats+=o.n||0;});
        stats=st;mine=ms;renderList();renderAcc();
      },function(){});
    }catch(e){}
  })();

  setProf("HR");
})();
</script>
<script data-goatcounter="https://beatthehr.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
